plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    // No `mappings` line: there is no Yarn for the 26.x scheme, and Loom 1.17 defaults to the
    // official Mojang mappings, which is what common/ is written against.
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    // Lives in common/, next to the NeoForge access transformer that does the same job.
    def accessWidener = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (accessWidener.exists()) {
        accessWidenerPath.set(accessWidener)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Creates the `gametest` source set plus the runGameTest task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-gametest"
        enableGameTests = true
        eula = true
    }
}

// The scenario bodies themselves are shared with NeoForge, so both loaders test the same behaviour.
configurations {
    commonGametestJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    commonGametestJava(project(path: ':common', configuration: 'commonGametestJava'))
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

// A failed run's world is evidence, so it is deleted before the next run rather than after this one.
def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    group = 'build'
    description = 'Delete the leftover Fabric game-test world before the next run.'
    delete project.layout.buildDirectory.dir('run/gameTest/world')
}
// Matched by name: the run tasks are created by the Fabric API extension after this script runs.
tasks.matching { it.name == 'runGameTest' }.configureEach {
    dependsOn(cleanGameTestWorld)
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
// findByName, not named: Loom 1.17 does not create every configuration the template assumes.
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.findByName(variant)?.attributes { attribute(loaderAttribute, 'fabric') }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) { attributes { attribute(loaderAttribute, 'fabric') } }
    }
}
