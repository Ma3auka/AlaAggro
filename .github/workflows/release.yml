# Release workflow template.
#
# Installed into a mod's public mirror by _scripts/sync-mirror-ci.sh, which fills the double-
# underscore placeholders below from <Mod>/docs/publishing/curseforge.env and gradle.properties.
# Do NOT hardcode a project id or a mod name here: this file used to be a verbatim copy of one
# mod's CI, and installing it into a second mod's mirror would have uploaded that mod's jars into
# the first mod's CurseForge project.
name: Release

# Uploads both loader jars to CurseForge when a version tag is pushed.
#
# The token lives in this repository's secrets and nowhere else — not on a developer machine,
# not in the private repository, not in any file. A human pushes the tag; the workflow does the
# upload. That is the whole point of doing it here rather than locally.
#
# The release notes come from the tag's own message, so one text reaches the CurseForge page
# without being retyped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). Leave empty to use the current ref.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and check, but upload nothing'
        type: boolean
        default: true
      platforms:
        description: >-
          Which platforms to publish to. Use a single platform to finish a partial release
          without re-uploading what already went through.
        type: choice
        options: [both, curseforge, modrinth]
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Declared at job level, not on a step: a step's own `env` is not visible to that step's `if`,
    # so an upload step guarded that way would skip silently forever — a release that looks green
    # and ships nothing.
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT: '1524541'
      # Numeric CurseForge version ids. Pinned rather than matched by name: matching "26.2" by name
      # also catches a legacy entry and the upload fails with a confusing error code.
      #   16498 = Minecraft 26.2 · 7499 = Fabric · 9639 = Environment: Server
      # The NeoForge id is resolved at run time because it has moved before.
      MC_ID: '16498'
      FABRIC_ID: '7499'
      SERVER_ENV_ID: '9639'
      # Modrinth. An empty project means the mod is not published there and every Modrinth step
      # is skipped — declared at job level because a step's own `env` is invisible to its `if`.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: 'GQeJXgZm'
      MODRINTH_SLUG: 'ala-aggro'
      # Minecraft version as Modrinth names it, and the Fabric API project every Fabric build
      # depends on. Dependencies on Modrinth are declared per VERSION, not per file — which is
      # why each loader gets its own version rather than one version carrying two jars.
      MODRINTH_GAME_VERSION: '26.2'
      FABRIC_API_PROJECT: 'P7dR8mSH'

    steps:
      - name: Resolve what we are releasing
        id: rel
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi

          if [ -n "$TAG" ]; then
            # Anchored regex, not a glob: in a glob `*` matches anything, so a pattern like
            # v[0-9]*.[0-9]*.[0-9]* happily accepts "v1.2.3; rm -rf /".
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)."
              exit 1
            fi
          fi

          # A rehearsal has to be possible BEFORE the tag exists — that is the point of rehearsing.
          # With no tag we check out the default branch and take the version from gradle.properties;
          # uploading is refused later in that case.
          #
          # Whether the tag exists is asked of the API, not of git: this step runs BEFORE checkout,
          # so there is no repository here and `git ls-remote` fails for every input. That failure
          # read as "no such tag" and made a real, tag-triggered release refuse to publish.
          if [ "$EVENT" = "push" ]; then
            # We were started BY the tag, so it exists by definition.
            echo "ref=$TAG"      >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
            echo "has_tag=true"  >> "$GITHUB_OUTPUT"
          elif [ -n "$TAG" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=$TAG"      >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
            echo "has_tag=true"  >> "$GITHUB_OUTPUT"
          else
            [ -n "$TAG" ] && echo "::notice::tag $TAG does not exist yet — running against the default branch"
            echo "ref=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
            echo "tag="          >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read the version
        id: ver
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          DECLARED="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ -n "$TAG" ] && [ "$DECLARED" != "${TAG#v}" ]; then
            echo "::error::tag says ${TAG#v} but gradle.properties says $DECLARED"
            exit 1
          fi
          echo "version=$DECLARED" >> "$GITHUB_OUTPUT"
          echo "releasing version $DECLARED"

      - name: Refuse to upload without a tag
        if: steps.rel.outputs.has_tag != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "::error::There is no tag to release. A real upload must come from a tag, so that"
          echo "the release notes and the published commit are pinned. Re-run with dry_run: true,"
          echo "or create the tag first."
          exit 1

      - name: Check the publishing configuration
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::CURSEFORGE_TOKEN is not set in this repository's secrets."
            echo "A missing token used to mean 'skip quietly', which turns the worst outcome —"
            echo "a release nobody can download — into a green check mark. Failing instead."
            exit 1
          fi
          echo "token present"

          if [ -n "$MODRINTH_PROJECT" ] && [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::MODRINTH_PROJECT is set but MODRINTH_TOKEN is not in this repository's secrets."
            echo "Failing rather than skipping: a half-published release is worse than none."
            exit 1
          fi
          [ -n "$MODRINTH_PROJECT" ] && echo "Modrinth token present" || echo "Modrinth not configured for this mod - those steps will be skipped"

      - name: Take the release notes from the tag
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Rehearsal without a tag — using a placeholder instead of release notes." > NOTES.md
            echo "placeholder notes (rehearsal)"
            exit 0
          fi
          # %(contents) is the whole message, verbatim. Do NOT rebuild it from subject and body:
          # git treats the subject as the first PARAGRAPH and folds its line breaks into one line,
          # so a wrapped opening paragraph would arrive on the store page as one long line.
          git tag -l --format='%(contents)' "$TAG" > NOTES.md
          if [ ! -s NOTES.md ] || [ -z "$(tr -d '[:space:]' < NOTES.md)" ]; then
            echo "::error::Tag $TAG carries no message. Create it with: git tag -a $TAG -F notes.md"
            exit 1
          fi
          echo "--- release notes ---"
          cat NOTES.md

      - name: No tooling traces in the published history
        run: |
          # A clean tree can still sit on a commit whose author or message says how it was made,
          # and unlike file contents that cannot be fixed later without rewriting history.
          #
          # The words are split so this file does not contain what it searches for. Note the
          # extra split in the third-to-last name: the cleanliness gate matches a bare acronym
          # on word boundaries, and a quote counts as one — leaving it in two pieces instead of
          # three would make this very file fail the gate.
          pattern="$(printf '%s|' \
            "c""laude" "a""nthropic" "co""pilot" "c""odex" "chat""g""pt" "open""ai" \
            "co-authored""-by" "generated"" with" "artificial"" intelligence" \
            "\\bg""pt\\b" "\\bl""lm\\b" | sed 's/|$//')"
          if git log --format='%an%n%ae%n%cn%n%ce%n%B' | grep -iE "$pattern"; then
            echo "::error::a tooling trace is present in the commit metadata"
            exit 1
          fi
          echo "commit metadata is clean"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders
        run: |
          # Belt and braces: the execute bit is stored in git, but Windows does not carry it, so a
          # file committed there can arrive without it and the build dies with "Permission denied".
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Resolve and validate the artifacts
        id: jars
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          FABRIC_JAR=$(ls fabric/build/libs/*.jar | grep -vE -- '-(dev|sources|javadoc)\.jar$' | head -1)
          NEOFORGE_JAR=$(ls neoforge/build/libs/*.jar | grep -vE -- '-(dev|sources|javadoc)\.jar$' | head -1)
          for f in "$FABRIC_JAR" "$NEOFORGE_JAR"; do
            [ -s "$f" ] || { echo "::error::missing or empty jar: $f"; exit 1; }
            case "$f" in *"-$VERSION.jar") ;; *) echo "::error::$f is not version $VERSION"; exit 1;; esac
          done
          # Each jar must carry its own loader's manifest — a swap here would ship the Fabric build
          # tagged as NeoForge, which crashes for everyone who downloads it.
          unzip -l "$FABRIC_JAR"   | grep -q 'fabric.mod.json'             || { echo "::error::fabric jar has no fabric.mod.json"; exit 1; }
          unzip -l "$NEOFORGE_JAR" | grep -q 'META-INF/neoforge.mods.toml' || { echo "::error::neoforge jar has no neoforge.mods.toml"; exit 1; }
          unzip -l "$FABRIC_JAR"   | grep -q 'neoforge.mods.toml'          && { echo "::error::fabric jar also carries a NeoForge manifest"; exit 1; }
          echo "fabric_jar=$FABRIC_JAR"     >> "$GITHUB_OUTPUT"
          echo "neoforge_jar=$NEOFORGE_JAR" >> "$GITHUB_OUTPUT"
          echo "Fabric:   $FABRIC_JAR"
          echo "NeoForge: $NEOFORGE_JAR"

      - name: Resolve the NeoForge modloader id
        id: loaders
        run: |
          versions="$(curl -sS --retry 3 --max-time 60 \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions")"
          NEOFORGE_ID=$(printf '%s' "$versions" | jq -r 'map(select(.name=="NeoForge")) | .[0].id // empty')
          [ -n "$NEOFORGE_ID" ] || { echo "::error::could not resolve the NeoForge modloader id"; exit 1; }
          echo "neoforge_id=$NEOFORGE_ID" >> "$GITHUB_OUTPUT"
          echo "NeoForge id: $NEOFORGE_ID (Fabric pinned $FABRIC_ID, Minecraft pinned $MC_ID)"

      - name: Which files already exist on CurseForge
        id: existing
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Re-running a failed release must not upload a second copy of a file that already went
          # through. The index goes to a FILE, never into an argument: it carries every file the
          # project ever published and has crossed the kernel's argument-size limit in a
          # neighbouring project, killing the step before either upload.
          #
          # BEST EFFORT ONLY, and the difference matters: this reads a third-party index that lags
          # from minutes to hours behind the platform. A re-run minutes after a successful upload
          # is told the file is absent and uploads a duplicate -- observed on Ala Loot 1.4.0, where
          # the check still reported 0/0 with both files already live. The Modrinth check below
          # asks that platform's own API and does not have this problem. When re-running to finish
          # a partial release, pass `platforms` instead of trusting this step.
          curl -sS --retry 3 --max-time 60 \
            "https://api.cfwidget.com/minecraft/mc-mods/${CURSEFORGE_PROJECT}" -o index.json || true
          FAB=0; NEO=0
          if [ -s index.json ]; then
            jq -r '.files[]?.display // empty' index.json | grep -qF "$VERSION (Fabric)"   && FAB=1
            jq -r '.files[]?.display // empty' index.json | grep -qF "$VERSION (NeoForge)" && NEO=1
          fi
          echo "fabric_exists=$FAB"   >> "$GITHUB_OUTPUT"
          echo "neoforge_exists=$NEO" >> "$GITHUB_OUTPUT"
          echo "already on CurseForge — fabric:$FAB neoforge:$NEO"

      - name: Upload the Fabric build
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.platforms != 'modrinth' && steps.existing.outputs.fabric_exists != '1'
        env:
          JAR: ${{ steps.jars.outputs.fabric_jar }}
          DISPLAY_NAME: Ala Aggro ${{ steps.ver.outputs.version }} (Fabric)
        run: |
          # --rawfile reads the notes from disk, preserving line breaks. Passing them between steps
          # through an output collapses newlines, which is what mangles the store page.
          metadata=$(jq -n --rawfile changelog NOTES.md --arg name "$DISPLAY_NAME" \
            --argjson mc "$MC_ID" --argjson loader "$FABRIC_ID" --argjson env "$SERVER_ENV_ID" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name,
              gameVersions: [$mc, $loader, $env], releaseType: "release"}')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o resp.json -w '%{http_code}' -X POST \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT}/upload-file" \
              -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              --form-string "metadata=$metadata" -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "uploaded (HTTP $code)"; cat resp.json; exit 0
            fi
            # No --fail: the response body says exactly what is wrong, and losing it costs a cycle.
            echo "::warning::attempt $attempt failed with HTTP $code"; cat resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          exit 1

      - name: Upload the NeoForge build
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.platforms != 'modrinth' && steps.existing.outputs.neoforge_exists != '1'
        env:
          JAR: ${{ steps.jars.outputs.neoforge_jar }}
          DISPLAY_NAME: Ala Aggro ${{ steps.ver.outputs.version }} (NeoForge)
          NEOFORGE_ID: ${{ steps.loaders.outputs.neoforge_id }}
        run: |
          metadata=$(jq -n --rawfile changelog NOTES.md --arg name "$DISPLAY_NAME" \
            --argjson mc "$MC_ID" --argjson loader "$NEOFORGE_ID" --argjson env "$SERVER_ENV_ID" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $name,
              gameVersions: [$mc, $loader, $env], releaseType: "release"}')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o resp.json -w '%{http_code}' -X POST \
              "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT}/upload-file" \
              -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              --form-string "metadata=$metadata" -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "uploaded (HTTP $code)"; cat resp.json; exit 0
            fi
            echo "::warning::attempt $attempt failed with HTTP $code"; cat resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          exit 1

      # ---------------------------------------------------------------------------------------
      # Modrinth. Skipped entirely when the mod has no project there.
      #
      # One VERSION per loader (`X.Y.Z+fabric`, `X.Y.Z+neoforge`) rather than one version with
      # two files: Modrinth declares dependencies per version, and only the Fabric build needs
      # Fabric API. A single version carrying both jars would force that dependency on NeoForge
      # players too.
      # ---------------------------------------------------------------------------------------
      - name: Which versions already exist on Modrinth
        id: modrinth
        if: env.MODRINTH_PROJECT != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Unlike the CurseForge check, this asks the platform's own API, so re-running a failed
          # release cannot produce a duplicate: an existing version_number is seen immediately.
          versions=$(curl -sSf --retry 5 --retry-delay 10 --retry-all-errors             --connect-timeout 20 --max-time 120             "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT}/version"             -H "User-Agent: Ma3auka/mod-release/1.0")
          fab=$(printf '%s' "$versions" | jq -r --arg v "$VERSION+fabric"   'any(.[]; .version_number == $v)')
          neo=$(printf '%s' "$versions" | jq -r --arg v "$VERSION+neoforge" 'any(.[]; .version_number == $v)')
          echo "fabric_exists=$fab"   >> "$GITHUB_OUTPUT"
          echo "neoforge_exists=$neo" >> "$GITHUB_OUTPUT"
          echo "already on Modrinth - fabric:$fab neoforge:$neo"

      - name: Publish the Fabric build to Modrinth
        if: env.MODRINTH_PROJECT != '' && github.event.inputs.dry_run != 'true' && github.event.inputs.platforms != 'curseforge' && steps.modrinth.outputs.fabric_exists != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.jars.outputs.fabric_jar }}
          DISPLAY_NAME: Ala Aggro ${{ steps.ver.outputs.version }} (Fabric)
        run: |
          data=$(jq -n --rawfile changelog NOTES.md             --arg project "$MODRINTH_PROJECT" --arg version "$VERSION+fabric"             --arg name "$DISPLAY_NAME" --arg mc "$MODRINTH_GAME_VERSION"             --arg fabricapi "$FABRIC_API_PROJECT"             '{name: $name, version_number: $version, changelog: $changelog,
              dependencies: [{project_id: $fabricapi, dependency_type: "required"}],
              game_versions: [$mc], version_type: "release", loaders: ["fabric"],
              featured: false, status: "listed", project_id: $project,
              file_parts: ["file"], primary_file: "file"}')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o resp.json -w '%{http_code}' -X POST               "https://api.modrinth.com/v2/version"               -H "Authorization: $MODRINTH_TOKEN"               -H "User-Agent: Ma3auka/mod-release/1.0"               --form-string "data=$data" -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "uploaded to Modrinth (HTTP $code)"; cat resp.json; exit 0
            fi
            echo "::warning::attempt $attempt failed with HTTP $code"; cat resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          exit 1

      - name: Publish the NeoForge build to Modrinth
        if: env.MODRINTH_PROJECT != '' && github.event.inputs.dry_run != 'true' && github.event.inputs.platforms != 'curseforge' && steps.modrinth.outputs.neoforge_exists != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          JAR: ${{ steps.jars.outputs.neoforge_jar }}
          DISPLAY_NAME: Ala Aggro ${{ steps.ver.outputs.version }} (NeoForge)
        run: |
          # No Fabric API dependency here - that is the whole reason for two versions.
          data=$(jq -n --rawfile changelog NOTES.md             --arg project "$MODRINTH_PROJECT" --arg version "$VERSION+neoforge"             --arg name "$DISPLAY_NAME" --arg mc "$MODRINTH_GAME_VERSION"             '{name: $name, version_number: $version, changelog: $changelog,
              dependencies: [], game_versions: [$mc], version_type: "release",
              loaders: ["neoforge"], featured: false, status: "listed", project_id: $project,
              file_parts: ["file"], primary_file: "file"}')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --connect-timeout 20 --max-time 180 -o resp.json -w '%{http_code}' -X POST               "https://api.modrinth.com/v2/version"               -H "Authorization: $MODRINTH_TOKEN"               -H "User-Agent: Ma3auka/mod-release/1.0"               --form-string "data=$data" -F "file=@$JAR")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "uploaded to Modrinth (HTTP $code)"; cat resp.json; exit 0
            fi
            echo "::warning::attempt $attempt failed with HTTP $code"; cat resp.json || true
            [ "$attempt" -lt 5 ] && sleep 15
          done
          exit 1

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "### Ala Aggro $VERSION"
            echo ""
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "Dry run — nothing was uploaded."
            else
              echo "CurseForge: https://www.curseforge.com/minecraft/mc-mods/alaaggro/files"
              if [ -n "$MODRINTH_PROJECT" ]; then
                echo ""
                echo "Modrinth: https://modrinth.com/mod/ala-aggro/versions"
              fi
            fi
            echo ""
            echo "Fabric:   \`$(basename '${{ steps.jars.outputs.fabric_jar }}')\`"
            echo "NeoForge: \`$(basename '${{ steps.jars.outputs.neoforge_jar }}')\`"
          } >> "$GITHUB_STEP_SUMMARY"
