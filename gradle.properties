# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache stays OFF: Fabric Loom is not compatible with it (fabric-loom#1349).
# This is not the build cache above, which is on.
org.gradle.configuration-cache=false

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.2, 26.3)
# NeoForm gives common/ a plain Minecraft classpath, with no loader API on it — that is what keeps
# loader-specific calls from compiling in shared code by accident.
neo_form_version=26.2-1
java_version=25

# --- Fabric (https://fabricmc.net/develop/) ---
fabric_version=0.153.0+26.2
fabric_loader_version=0.19.3

# --- NeoForge (https://projects.neoforged.net/neoforged/neoforge) ---
neoforge_version=26.2.0.67
neoforge_loader_version_range=[4,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=alaaggro
# The human-readable display name for the mod.
mod_name=AlaAggro
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.ma3auka.alaaggro

## Mod Metadata (expanded into BOTH fabric.mod.json and neoforge.mods.toml)
mod_authors=Ma3auka
mod_credits=Built with NeoForge and Fabric. Thanks to both loader teams and the Minecraft modding community.
# Non-ASCII must be written as \\uXXXX: Gradle reads this file as ISO-8859-1, and a raw character
# ends up double-encoded inside the jar.
description=Every mob attacks you on sight - passive farm animals, fish, bats, all of them. Configurable damage and speed, call for help, long-term memory, dimension blacklist, per-player exemptions, and protection for tamed pets.
display_url=https://www.curseforge.com/minecraft/mc-mods/alaaggro
issue_tracker_url=https://github.com/Ma3auka/AlaAggro/issues
update_json_url=https://raw.githubusercontent.com/Ma3auka/AlaAggro/main/update.json

# --- Test dependencies ---
junit_version=5.10.2
