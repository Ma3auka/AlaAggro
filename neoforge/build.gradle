plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Declared before the neoForge block, so `mods { … sourceSet sourceSets.gametest }` can see it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version

    // Lives in common/, next to the Fabric access widener that does the same job.
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
            programArguments.add '--nogui'
        }
        gameTests {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gameTests'))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // A separate mod, not a second source set of the same one: two source sets of one mod share
        // a single virtual file system where a path resolves to exactly one file, so a test fixture
        // would shadow a real resource instead of merging with it.
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
}

configurations {
    commonGametestJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    commonGametestJava(project(path: ':common', configuration: 'commonGametestJava'))
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

def cleanGameTestWorld = tasks.register('cleanNeoForgeGameTestWorld', Delete) {
    group = 'build'
    description = 'Delete the leftover NeoForge game-test world before the next run.'
    delete project.layout.projectDirectory.dir('runs/gameTests/gametestserver/gametestworld')
}
tasks.matching { it.name == 'runGameTests' }.configureEach {
    dependsOn(cleanGameTestWorld)
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) { attributes { attribute(loaderAttribute, 'neoforge') } }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName,
     it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) { attributes { attribute(loaderAttribute, 'neoforge') } }
    }
}
